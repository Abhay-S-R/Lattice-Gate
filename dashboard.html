<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIG Trust Console</title>
<meta name="description" content="KIG (Key Identity Guard) Trust & Verification Console: 12 Track 4 goals, cluster storyboard, benchmarks, audit chain, crash recovery, detector and PQ messaging, from the final-5410c49 evidence bundle.">
<style>
:root{
  --bg:#070b12;--rail:#0c121e;--panel:#111827;--panel2:#131c2e;--panel3:#0e1626;
  --border:#1f2a40;--border2:#2b3a58;
  --green:#10b981;--green2:#34d399;--cyan:#06b6d4;--blue:#38bdf8;--violet:#a855f7;--violet2:#c084fc;
  --amber:#f59e0b;--red:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;gap:18px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand svg{flex:none}
.menu-btn{display:none;margin-left:auto;background:transparent;border:1px solid var(--border2);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;border-left:3px solid transparent;font-weight:500}
.nav a:hover{background:rgba(148,163,184,.07);color:var(--text)}
.nav a.active{background:rgba(16,185,129,.12);border-left-color:var(--green);color:var(--text)}
.nav a .ico{width:18px;text-align:center;opacity:.85;font-family:var(--mono);font-size:12px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.health{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--border2);font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;text-align:left}
.health .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.health.warn .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.health.bad .dot{background:var(--red);box-shadow:0 0 8px var(--red)}
.side-note{font-size:11.5px;color:var(--dim);padding:0 8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0a101b,var(--bg))}
.topbar h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.topbar h1 span{color:var(--muted);font-weight:500}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta .chip{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.meta .chip b{color:var(--text);font-weight:600}

.goalstrip-wrap{border-bottom:1px solid var(--border);background:var(--panel3)}
.goalstrip{display:flex;gap:6px;overflow-x:auto;padding:10px 24px;scrollbar-width:thin}
.gpill{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:8px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:12.5px;color:var(--muted);text-align:left}
.gpill:hover{border-color:var(--border2);color:var(--text)}
.gpill.active{border-color:var(--green);color:var(--text);box-shadow:0 0 0 1px rgba(16,185,129,.35),0 0 14px rgba(16,185,129,.15)}
.gpill .num{font-family:var(--mono);font-weight:700;font-size:11px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:rgba(16,185,129,.14);color:var(--green2)}
.gpill .num.s-synthetic,.gpill .num.s-scope{background:rgba(6,182,212,.14);color:var(--cyan)}
.gpill .num.s-unsupported{background:rgba(245,158,11,.14);color:var(--amber)}
.gpill .num.s-fail{background:rgba(239,68,68,.16);color:var(--red)}

.view{padding:20px 24px 56px;width:100%;max-width:1480px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.view-head h2{margin:0;font-size:20px}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:820px}

/* ---------- layout primitives ---------- */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;min-width:0}
.card.alt{background:var(--panel2)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h3{margin:0;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card-h .src{font-family:var(--mono);font-size:11px;color:var(--dim)}
.kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--border);margin:14px 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--panel3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:650;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}
.stat .n{font-size:11px;color:var(--dim);margin-top:2px}
.v.ok{color:var(--green2)}.v.cy{color:var(--blue)}.v.vi{color:var(--violet2)}.v.am{color:var(--amber)}.v.bad{color:var(--red)}

.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1.6}
.b-measured,.b-pass{color:var(--green2);border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.1)}
.b-synthetic,.b-scope,.b-info{color:var(--cyan);border-color:rgba(6,182,212,.45);background:rgba(6,182,212,.1)}
.b-pqc{color:var(--violet2);border-color:rgba(168,85,247,.45);background:rgba(168,85,247,.1)}
.b-unsupported,.b-warn{color:var(--amber);border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1)}
.b-fail,.b-error{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.b-na{color:var(--dim);border-color:var(--border2);background:transparent}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--border2);cursor:pointer;font-size:12.5px;font-weight:550;color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.5)}
.btn.on{border-color:var(--green);background:rgba(16,185,129,.16);color:var(--green2)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}

table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--border2);white-space:nowrap}
table.data td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.data td.num,table.data th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
table.data tr.sel td{background:rgba(56,189,248,.07)}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:rgba(148,163,184,.05)}
.tbl-wrap{overflow-x:auto;max-width:100%}

.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.07);color:#fcd9a0;font-size:12.5px}
.notice.info{border-color:rgba(6,182,212,.35);background:rgba(6,182,212,.06);color:#bfeff8}
.notice.bad{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.07);color:#fecaca}
.na{color:var(--dim);font-family:var(--mono)}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:3px 0}
.detail-line{font-family:var(--mono);font-size:12px;color:#cbd5e1;background:var(--panel3);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:6px;padding:8px 10px;word-break:break-word}

.svg-box{background:var(--panel3);border:1px solid var(--border);border-radius:8px;padding:8px;overflow-x:auto}
.svg-box svg{display:block;width:100%;height:auto}
svg text{font-family:var(--ui)}
svg .mono{font-family:var(--mono)}

/* storyboard */
.story{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.stepchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.stepchip{width:30px;height:26px;border-radius:6px;border:1px solid var(--border2);background:var(--panel3);font-family:var(--mono);font-size:11.5px;cursor:pointer;color:var(--muted)}
.stepchip.pass{border-color:rgba(16,185,129,.35)}
.stepchip.fail{border-color:var(--red);color:var(--red)}
.stepchip.cur{background:var(--green);border-color:var(--green);color:#04130d;font-weight:700}
input[type=range]{width:100%;accent-color:var(--green)}

/* loader */
.drop{border:1.5px dashed var(--border2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);transition:.15s;background:var(--panel3)}
.drop.over{border-color:var(--green);background:rgba(16,185,129,.07);color:var(--text)}
.filecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.filecard{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--panel3);font-size:12px;min-width:0}
.filecard .fn{font-family:var(--mono);font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard .w{color:#fcd9a0;font-size:11.5px;margin-top:4px}

/* goal detail */
.goal-hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
.goal-num{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--green2);line-height:1}
.goal-num.s-unsupported{color:var(--amber)}.goal-num.s-synthetic,.goal-num.s-scope{color:var(--cyan)}
.ops{display:flex;flex-direction:column;gap:10px;counter-reset:op}
.op{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel3)}
.op .idx{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(56,189,248,.12);color:var(--blue);font-family:var(--mono);font-weight:700;font-size:12px}
.op h4{margin:0;font-size:13.5px}
.op .actor{font-family:var(--mono);font-size:11px;color:var(--violet2)}
.iar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;font-size:12px}
.iar div{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px;min-width:0}
.iar b{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.ev-link{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--green2);word-break:break-word}
.ev-link.none{color:var(--dim)}
details.raw{margin-top:10px}
details.raw summary{cursor:pointer;color:var(--blue);font-size:12.5px}
pre.json{margin:8px 0 0;max-height:360px;overflow:auto;background:#050911;border:1px solid var(--border);border-radius:8px;padding:10px;font:11.5px/1.5 var(--mono);color:#cbd5e1;white-space:pre}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);word-break:break-word}

/* audit sim */
.sim-rows{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11.5px}
.sim-row{display:grid;grid-template-columns:44px 120px minmax(0,1fr) 96px;gap:8px;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel3);opacity:.45;transition:opacity .15s}
.sim-row.done{opacity:1}
.sim-row.bad{border-color:var(--red);background:rgba(239,68,68,.08)}
.sim-row .h{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sim-row .st{text-align:right}
.crash-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.crash-card{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--panel3);cursor:pointer;text-align:left;min-width:0}
.crash-card.sel{border-color:var(--blue);box-shadow:0 0 0 1px rgba(56,189,248,.3)}
.crash-card .pt{font-family:var(--mono);font-size:12px;font-weight:700;overflow-wrap:anywhere}

/* chunks */
.chunks{display:flex;flex-wrap:wrap;gap:6px}
.chunk{min-width:64px;padding:8px;border-radius:6px;border:1px solid var(--border2);background:var(--panel3);font-family:var(--mono);font-size:11px;text-align:center}
.chunk.got{border-color:var(--green);color:var(--green2);background:rgba(16,185,129,.08)}
.chunk.lost{border-color:var(--red);color:var(--red)}
.chunk.dead{border-color:var(--red);background:rgba(239,68,68,.12);color:var(--red)}
.log{font-family:var(--mono);font-size:11.5px;background:#050911;border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:220px;overflow:auto;color:#cbd5e1}
.log div{padding:1px 0}
.field{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.field input,.field select{background:var(--panel3);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:5px 8px;font:12.5px var(--mono);width:auto}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.crash-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1024px){.story{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;height:auto;flex-direction:column;padding:10px 16px;gap:8px;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:0}
  .menu-btn{display:inline-block}
  .nav,.side-foot{display:none}
  .sidebar.open .nav,.sidebar.open .side-foot{display:flex}
  .side-foot{margin-top:4px}
  .topbar,.goalstrip{padding-left:16px;padding-right:16px}
  .view{padding:16px 16px 48px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}
  .meta .chip{white-space:normal}
}
@media (max-width:600px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .crash-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .iar{grid-template-columns:1fr}
  .sim-row{grid-template-columns:36px minmax(0,1fr) 80px}
  .sim-row .h{display:none}
  .kv{grid-template-columns:1fr}
  .topbar h1{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.4 5.1 13.4 12 15 6.9-1.6 12-7.6 12-15V7L16 2z" fill="#0f2a22" stroke="#10b981" stroke-width="1.6"/><path d="M11 16.5l3.4 3.4L21.5 12.6" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>KIG Console</span>
      <button class="menu-btn" data-action="menu" aria-expanded="false" aria-controls="nav">Menu</button>
    </div>
    <nav class="nav" id="nav" aria-label="Primary">
      <a href="#overview" data-nav="overview"><span class="ico">◎</span>Overview</a>
      <a href="#telemetry" data-nav="telemetry"><span class="ico">≋</span>Telemetry</a>
      <a href="#audit" data-nav="audit"><span class="ico">⛓</span>Audit &amp; Crash</a>
      <a href="#detection" data-nav="detection"><span class="ico">⌖</span>Detection</a>
      <a href="#messaging" data-nav="messaging"><span class="ico">⇄</span>Messaging</a>
      <a href="#about" data-nav="about"><span class="ico">ⓘ</span>About &amp; Scope</a>
    </nav>
    <div class="side-foot">
      <button class="health" id="health" data-action="goto-loader" title="Evidence health (click to open the evidence loader)"><span class="dot"></span><span id="health-text">Checking…</span></button>
      <div class="side-note" id="side-note">Offline · no network requests</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <h1>KIG <span>|</span> Trust &amp; Verification Console</h1>
        <div class="sub">Zero Dependencies. Full Transparency.</div>
      </div>
      <div class="meta" id="meta"></div>
    </header>
    <div class="goalstrip-wrap"><div class="goalstrip" id="goalstrip" role="navigation" aria-label="Track 4 goals"></div></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<input type="file" id="file-input" multiple accept=".json,.txt,application/json,text/plain" hidden>

<script>

const APP_META = {

/* =====================================================================
   3. EvidenceParser (identify, validate, normalise, collect warnings)
   ===================================================================== */
const EvidenceParser = {
  identify(filename, data, text) {
    const f = (filename || '').toLowerCase();
    for (const d of FILES) if (f === d.file || f.endsWith('/' + d.file)) return d.key;
    if (f.includes('bench-perf') || f.includes('bench_perf')) return 'benchPerf';
    if (f.includes('revocation')) return 'benchRevocation';
    if (f.includes('bench-detect') || f.includes('detect-bench')) return 'benchDetect';
    if (f.includes('detect-practice') || f.includes('detect-')) { if (data && data.holdout) return 'benchDetect'; if (data) return 'detectPractice'; }
    if (f.includes('crash')) return 'crashTest';
    if (f.includes('msg')) return 'msgDemo';
    if (f.includes('demo')) return 'demo';
    if (data && typeof data === 'object') {
      if (Array.isArray(data.steps)) return 'demo';
      if (data.results && data.environment) return 'benchPerf';
      if (data.nodes && data.partition) return 'benchRevocation';
      if (data.holdout || data.per_seed) return 'benchDetect';
      if (Array.isArray(data.alerts) && Array.isArray(data.timeline)) return 'detectPractice';
      if (Array.isArray(data.points)) return 'crashTest';
    }
    if (text && /Session resumption|forward secrecy|transport receipt/i.test(text)) return 'msgDemo';
    return null;
  },
  parseMsgDemo(text) {
    const lines = String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    return { lines };
  },
  validate(key, d) {
    const w = []; let status = 'valid', count = 0;
    const need = (cond, msg) => { if (!cond) { w.push(msg); status = 'error'; } };
    const warn = (cond, msg) => { if (!cond) { w.push(msg); if (status === 'valid') status = 'warning'; } };
    if (!d || typeof d !== 'object') return { status: 'error', recordCount: 0, warnings: ['not a JSON object'] };
    switch (key) {
      case 'demo':
        need(Array.isArray(d.steps), 'missing steps[]');
        if (Array.isArray(d.steps)) {
          count = d.steps.length;
          d.steps.forEach(s => warn(s && s.status === 'PASS', `step ${s && s.n} status ${s && s.status}`));
          warn(d.steps.every(s => isNum(s.n) && typeof s.title === 'string'), 'some steps lack n/title');
        }
        warn(typeof d.pass === 'boolean', 'missing pass');
        if (d.pass === false) warn(false, 'demo pass = false');
        break;
      case 'benchPerf':
        need(d.results && typeof d.results === 'object', 'missing results');
        if (d.results) {
          for (const s of ['adapter_whole_process', 'crypto_in_process', 'storage_in_process', 'messaging_in_process', 'cluster_round2']) warn(d.results[s], `missing results.${s}`);
          count = Object.values(d.results).reduce((a, sec) => a + (sec && typeof sec === 'object' ? Object.values(sec).filter(v => v && isNum(v.p50_ms)).length : 0), 0);
        }
        warn(d.environment, 'missing environment');
        break;
      case 'benchRevocation':
        need(d.nodes && typeof d.nodes === 'object', 'missing nodes');
        if (d.nodes) for (const n of Object.keys(d.nodes)) warn(isNum(get(d.nodes[n], 'first_denial_ms.p50')), `node ${n}: missing first_denial_ms.p50`);
        warn(d.partition, 'missing partition');
        count = isNum(d.n) ? d.n : 0;
        break;
      case 'benchDetect':
        need(d.holdout, 'missing holdout');
        warn(d.data_origin, 'missing data_origin');
        count = isNum(get(d, 'holdout.events')) ? d.holdout.events : 0;
        break;
      case 'detectPractice':
        need(Array.isArray(d.timeline) || Array.isArray(d.alerts), 'missing timeline[] and alerts[]');
        warn(Array.isArray(d.timeline), 'missing timeline[]');
        warn(Array.isArray(d.alerts), 'missing alerts[]');
        if (Array.isArray(d.rejects) && d.rejects.length) warn(false, `${d.rejects.length} rejected input row(s)`);
        count = Array.isArray(d.timeline) ? d.timeline.length : (d.alerts || []).length;
        break;
      case 'crashTest':
        need(Array.isArray(d.points), 'missing points[]');
        if (Array.isArray(d.points)) { count = d.points.length; d.points.forEach(p => warn(p.pass === true, `point ${p.point} did not pass`)); }
        break;
      case 'msgDemo':
        need(Array.isArray(d.lines) && d.lines.length, 'empty file');
        count = (d.lines || []).length;
        (d.lines || []).forEach(l => { if (/^FAIL/.test(l)) warn(false, l.slice(0, 80)); });
        break;
    }
    return { status, recordCount: count, warnings: w };
  }
};

    const pos = {}; services.forEach((sv, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / services.length; pos[sv] = { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), w: 18 + sv.length * 6.6, h: 24 }; });
    const sel = alerts.find(a => a.alert_id === selId);

    const edges = new Map();
    timeline.forEach(e => {
      if (!e.src || !e.dst) return;

      const cur = edges.get(key) || { src: e.src, dst: e.dst, outcomes: new Set(), cls: new Set(), ids: [] };
      cur.outcomes.add(e.outcome); cur.cls.add(e.classification); cur.ids.push(e.event_id); edges.set(key, cur);
    });
    const clip = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y; const sc = Math.min((b.w / 2 + 4) / Math.abs(dx || 1e-6), (b.h / 2 + 4) / Math.abs(dy || 1e-6)); return { x: b.x - dx * Math.min(sc, 1), y: b.y - dy * Math.min(sc, 1) }; };

    for (const [key, e] of edges) {
      const a = pos[e.src], b = pos[e.dst];
      const rev = edges.has(`${e.dst}->${e.src}`);
      let ax = a.x, ay = a.y, bx = b.x, by = b.y;
      if (rev) { const nx = -(b.y - a.y), ny = b.x - a.x, L = Math.hypot(nx, ny) || 1; ax += nx / L * 5; ay += ny / L * 5; bx += nx / L * 5; by += ny / L * 5; }
      const end = clip({ x: ax, y: ay }, { x: bx, y: by, w: b.w, h: b.h });
      const start = clip({ x: bx, y: by }, { x: ax, y: ay, w: a.w, h: a.h });
      const ae = alertEdges.get(key);

      const enforce = e.cls.has('expected_enforcement');

      else if (enforce) { col = C.amber; dash = '5 4'; mk = id2; wdt = 1.6; }
      s += `<line x1="${start.x}" y1="${start.y}" x2="${end.x}" y2="${end.y}" stroke="${col}" stroke-width="${wdt}" ${dash ? `stroke-dasharray="${dash}"` : ''} opacity="${op}" marker-end="url(#${mk})"><title>${esc(key)} · ${esc([...e.outcomes].join('/'))} · ${esc(e.ids.join(', '))}</title></line>`;
      if (ae) { const mx = (start.x + end.x) / 2, my = (start.y + end.y) / 2; s += `<circle cx="${mx}" cy="${my}" r="9" fill="#2a1016" stroke="${C.red}" opacity="${op}"/><text x="${mx}" y="${my + 3.5}" fill="${C.red}" font-size="10" text-anchor="middle" font-weight="700" opacity="${op}">${ae.order}</text>`; }
    }
    const hot = new Set(); alerts.forEach(a => (a.services || []).forEach(x => hot.add(x)));
    const sens = new Set(get(ev().detectPractice || {}, 'config.sensitiveServices') || []);
    services.forEach(sv => {
      const p = pos[sv]; const col = sel && (sel.services || []).includes(sv) ? C.red : hot.has(sv) ? '#f87171' : C.blue;
      s += `<rect x="${p.x - p.w / 2}" y="${p.y - p.h / 2}" width="${p.w}" height="${p.h}" rx="12" fill="${C.panel2}" stroke="${col}" stroke-width="1.4"/>`;
      s += `<text x="${p.x}" y="${p.y + 4}" fill="${C.text}" font-size="11" text-anchor="middle" class="mono">${esc(sv)}${sens.has(sv) ? ' ◆' : ''}</text>`;
    });

    return this.wrap(s, W, H, 560, 'lateral movement graph');
  },
  /* receipt (ingest) order vs corrected order; crossing lines = reordering */
  orderTimeline(timeline, selIds = [], o = {}) {
    if (!timeline.length) return `<div class="notice"><span>⚠</span><span>No timeline in the loaded evidence (N/A).</span></div>`;
    const N = timeline.length, step = o.compact ? 26 : 30, x0 = o.compact ? 14 : 120, W = x0 + N * step + 10;
    const y1 = o.compact ? 16 : 34, y2 = o.compact ? 16 : 104, H = o.compact ? 46 : 150;
    const sel = new Set(selIds);

      const xa = x0 + ing * step + step / 2, xb = x0 + ord * step + step / 2;
      const col = colOf(e), on = sel.has(e.event_id), re = ing !== ord, off = isNum(e.source_clock_offset_ms) && e.source_clock_offset_ms !== 0;
      const r = on ? 7 : 5;
      const tip = `<title>${esc(e.event_id)} · ${esc(e.actor)} ${esc(e.src)}→${esc(e.dst)} ${esc(e.action)} (${esc(e.outcome)}) · ${esc(e.classification)}${off ? ` · offset ${e.source_clock_offset_ms} ms` : ''}${re ? ' · reordered' : ''}</title>`;

      s += `<circle cx="${xa}" cy="${y1}" r="${r}" fill="${col}" opacity=".9">${tip}</circle><circle cx="${xb}" cy="${y2}" r="${r}" fill="${col}">${tip}</circle>`;
      if (off) s += `<circle cx="${xb}" cy="${y2}" r="${r + 4}" fill="none" stroke="${C.violet2}" stroke-width="1.5"/>`;
      if (on) s += `<circle cx="${xb}" cy="${y2}" r="${r + 7}" fill="none" stroke="${C.text}" stroke-width="1" opacity=".6"/>`;
      s += `<text x="${xb}" y="${y2 + 26}" fill="${on ? C.text : C.dim}" font-size="9.5" text-anchor="middle" class="mono">${esc(String(e.event_id).replace(/^evt-/, ''))}</text>`;
    });

  },
  /* event / received / corrected times for selected events */
  clockLanes(events) {
    if (!events.length) return `<div class="notice"><span>⚠</span><span>No clock-adjusted or reordered events in the loaded evidence (N/A).</span></div>`;
    const t = (x) => Date.parse(x);
    // each lane is drawn relative to its own corrected time (0 ms), so events minutes apart share one readable axis
    const rel = events.map(e => { const ct = isNum(e.corrected_ms) ? e.corrected_ms : t(e.corrected_time_utc); return { e, et: t(e.event_time_utc) - ct, rt: t(e.received_time_utc) - ct }; });
    const vals = rel.flatMap(r => [0, r.et, r.rt]).filter(isNum);
    const lo = Math.floor((Math.min(...vals) - 400) / 1000) * 1000, hi = Math.ceil((Math.max(...vals) + 400) / 1000) * 1000;
    const W = 720, x0 = 170, x1 = W - 100, laneH = 46, H = 30 + events.length * laneH + 30;

    s += `<text x="${X(0)}" y="14" fill="${C.green2}" font-size="10" text-anchor="middle" class="mono">corrected time</text>`;

      const y = 40 + i * laneH;

      s += `<text x="10" y="${y + 18}" fill="${C.dim}" font-size="9.5" class="mono">offset ${esc(e.source_clock_offset_ms)} · ingest ${esc(e.ingest_idx)} → order ${esc(e.order_idx)}</text>`;
      if (isNum(et) && et !== 0) s += `<line x1="${X(et)}" x2="${X(0)}" y1="${y}" y2="${y}" stroke="${C.violet2}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      if (isNum(rt)) s += `<line x1="${X(0)}" x2="${X(rt)}" y1="${y}" y2="${y}" stroke="${C.blue}" stroke-width="2"/>`;
      if (isNum(et)) s += `<circle cx="${X(et)}" cy="${y}" r="5" fill="${C.panel3}" stroke="${C.violet2}" stroke-width="1.5"><title>event_time ${esc(e.event_time_utc)}</title></circle>`;

      if (isNum(rt)) s += `<rect x="${X(rt) - 4.5}" y="${y - 4.5}" width="9" height="9" fill="${C.blue}"><title>received ${esc(e.received_time_utc)}</title></rect>`;

  /* generic proportion bars: {label, value, total, color} */
  fracBars(rows, o = {}) {

  },
  handshake(step) {
    const items = [
      { who: 'I', self: true, t: '(ek_e, dk_e) ← fresh ML-KEM-768 keypair (ephemeral)' },
      { from: 'I', to: 'R', t: 'M1 {ver, suite, I_dev, R_dev, n_i, ek_e, sig_I over TH1}' },
      { who: 'R', self: true, t: 'check I active · verify sig_I · (ct, ss) ← Encaps(ek_e) · TH2 · HKDF' },
      { from: 'R', to: 'I', t: 'M2 {ct, n_r, epoch, sig_R over TH2, mac_R}' },
      { who: 'I', self: true, t: 'verify sig_R · ss ← Decaps(dk_e, ct) · check mac_R · wipe dk_e' },
      { from: 'I', to: 'R', t: 'M3 {mac_I = HMAC(k_conf, "I" ‖ TH2)}' },
      { who: 'R', self: true, t: 'check mac_I → session_id = H("kig/v1/sid" ‖ TH2)[0..16)' },

    s += `<rect x="${xi - 80}" y="8" width="160" height="28" rx="7" fill="${C.panel2}" stroke="${C.violet}"/><text x="${xi}" y="26" fill="${C.text}" font-size="11.5" text-anchor="middle" font-weight="600">Initiator (alice-laptop)</text>`;
    s += `<rect x="${xr - 80}" y="8" width="160" height="28" rx="7" fill="${C.panel2}" stroke="${C.violet}"/><text x="${xr}" y="26" fill="${C.text}" font-size="11.5" text-anchor="middle" font-weight="600">Responder (bob-laptop)</text>`;
    s += `<line x1="${xi}" x2="${xi}" y1="36" y2="${H - 6}" stroke="${C.border2}" stroke-dasharray="3 4"/><line x1="${xr}" x2="${xr}" y1="36" y2="${H - 6}" stroke="${C.border2}" stroke-dasharray="3 4"/>`;
    items.forEach((it, i) => {
      const y = top + i * rowH + 14, done = i < step, cur = i === step;
      const col = cur ? C.violet2 : done ? C.green2 : C.dim, op = cur || done ? 1 : .5;
      if (it.self) {
        const x = it.who === 'I' ? xi : xr;

        s += `<text x="${it.who === 'I' ? x + 14 : x - 14}" y="${y + 4}" fill="${col}" font-size="11" ${it.who === 'I' ? '' : 'text-anchor="end"'} opacity="${op}" class="mono">${esc(it.t)}</text>`;

      } else {

        s += `<text x="${(a + b) / 2}" y="${y - 2}" fill="${col}" font-size="11" text-anchor="middle" opacity="${op}" class="mono">${esc(it.t)}</text>`;

  },
  aad(fields) {
    const W = 720, H = 132, n = fields.length, bw = (W - 20 - (n - 1) * 6) / n;
    let s = `<text x="10" y="16" fill="${C.muted}" font-size="11">AAD = encode("kig/v1/record", …) — any change breaks the AES-256-GCM tag; recipient_dev is checked before decrypting</text>`;

    return this.wrap(s, W, H, 600, 'record AAD and replay window');
  }
};

function storyState(n) {
  const steps = get(ev(), 'demo.steps') || [];
  const upto = steps.filter(s => s.n <= n);
  const all = upto.flatMap(s => s.details || []);
  const cur = (steps.find(s => s.n === n) || {}).details || [];
  let version = null, epoch = null, killPoint = null, staged = null;
  for (const d of all) {
    let m;
    const vre = /(?:re-keyed \d+ -> (\d+))|(?:\bv(\d+) active)|(?:decrypted v(\d+))|(?:read v(\d+))|(?:kept v(\d+) active)/g;
    while ((m = vre.exec(d))) version = m.slice(1).find(Boolean);
    const ere = /epoch[: ](\d+)/g; while ((m = ere.exec(d))) epoch = m[1];
  }
  for (const d of cur) { const m = /SIGKILLed at (\w+)(?: \(v(\d+) staged\))?/.exec(d); if (m) { killPoint = m[1]; staged = m[2]; } }
  const revoked = new Set(); all.forEach(d => { const m = /LOST "([^"]+)"/.exec(d); if (m) revoked.add(m[1]); });
  const enrolled = upto.some(s => /enrol/i.test(s.title || '')) || all.some(d => /enrolled/.test(d));
  const replacement = all.some(d => /alice-phone-2/.test(d));
  const repNow = cur.some(d => /alice-phone-2/.test(d));
  const dev = (id, node, on) => {
    const state = !on ? 'absent' : revoked.has(id) ? 'revoked' : 'active';
    const label = state === 'absent' ? 'not enrolled' : state === 'revoked' ? 'Revoked · device_revoked' : 'Active';
    return { id, node, state, label };
  };
  const devices = [dev('alice-phone', 'A', enrolled), dev('alice-laptop', 'B', enrolled), dev('bob-laptop', 'C', enrolled), dev('alice-phone-2', 'A', replacement)];
  if (repNow) devices[3].label = 'Pending → Active';
  return { version: version ? 'brief v' + version + (staged ? ` (v${staged} staged → aborted)` : '') : null, epoch, cp: killPoint ? 'sigkill' : 'healthy', killPoint, devices };
}

function goalChips(goalStr) {
  const nums = String(goalStr || '').split(/[,\s]+/).map(x => parseInt(x, 10)).filter(x => x >= 1 && x <= 12);
  if (!nums.length) return `<span class="badge b-na">${esc(goalStr || 'n/a')}</span>`;
  return nums.map(g => `<a class="btn sm" href="#goal/${g}">Goal ${g} · ${esc(GOALS_CONFIG[g - 1].short)}</a>`).join(' ');
}

function safe(fn, fallback) { try { const v = fn(); return v === undefined ? fallback : v; } catch (e) { console.warn('render fallback:', e); return fallback; } }

function perfTable(section, names) {
  const sec = perf(section);
  if (!sec || typeof sec !== 'object') return naNotice(`bench-perf.json results.${section}`);
  const keys = names || Object.keys(sec).filter(k => sec[k] && typeof sec[k] === 'object' && 'p50_ms' in sec[k]);
  return `<div class="tbl-wrap"><table class="data"><thead><tr><th>Measurement</th><th class="num">n</th><th class="num">p50</th><th class="num">p95</th><th class="num">max</th><th class="num">mean</th></tr></thead><tbody>
    ${keys.map(k => { const o = sec[k] || {}; const d = isNum(o.p50_ms) && o.p50_ms < 1 ? 3 : 1; return `<tr><td class="mono">${esc(k)}</td><td class="num">${fmt(o.n, 0)}</td><td class="num">${fmt(o.p50_ms, d)}</td><td class="num">${fmt(o.p95_ms, d)}</td><td class="num">${fmt(o.max_ms, d)}</td><td class="num">${fmt(o.mean_ms, d)}</td></tr>`; }).join('')}
  </tbody></table></div><div class="dim" style="font-size:11px;margin-top:4px">all values in ms</div>`;
}

/* ---------- audit tamper simulator (in-memory only; never touches loaded evidence) ---------- */
const SIM_EVENTS = [
  ['device.enrol', 'operator', 'alice-phone', 'allow'], ['device.enrol', 'alice-phone', 'alice-laptop', 'allow'], ['file.publish', 'alice-laptop', 'brief v1', 'allow'],
  ['file.rotate', 'operator', 'brief v2', 'allow'], ['device.revoke', 'operator', 'alice-phone', 'allow'], ['file.read', 'alice-phone', 'brief v2', 'deny:device_revoked'],

function buildChain(events, dbId = 'cp-registry') {
  const genesis = sha256(encodeFields('kig/v1/genesis', [dbId]));

  events.forEach((e, i) => { const row = { seq: i + 1, kind: e[0], actor: e[1], resource: e[2], decision: e[3] }; row.hash = sha256(prev + encodeFields('kig/v1/event', [row.seq, row.kind, row.actor, row.resource, row.decision])); prev = row.hash; rows.push(row); });

function verifyChain(chain, anchor) {

  if (anchor.seq > last) return { res, broken: { seq: last + 1, code: 'truncated' } };
  if (anchor.seq === last && anchor.head !== prev) return { res, broken: { seq: last, code: 'invalid_checkpoint' } };

}
function auditScenario(mode) {
  const base = buildChain(SIM_EVENTS);
  const anchor = { seq: base.rows.length, head: base.rows[base.rows.length - 1].hash };
  const chain = clone(base);
  let note = '', backup = null;
  if (mode === 'edit_row') { chain.rows[1].actor = 'mallory'; note = 'Row seq 2 actor edited in place (alice-phone → mallory) without recomputing hashes, as with sqlite3 UPDATE on a copy.'; }
  if (mode === 'truncate_tail') { chain.rows.splice(-2); note = 'Last two rows deleted. Chain links still verify, but the external anchor says seq 8 existed.'; }
  if (mode === 'newline_json') {
    const inj = 'x\n{"actor":"admin","decision":"allow"}';
    const ev2 = SIM_EVENTS.concat([['file.read', inj, 'brief v3', 'deny:unknown_device']]);
    const c2 = buildChain(ev2); chain.genesis = c2.genesis; chain.rows = c2.rows;

  }

    const live = liveEpoch();
    const payload = 'SQLite format 3\u0000' + SIM_EVENTS.map(e => e.join('|')).join(';');
    const digest = sha256(payload);
    const flipped = payload.slice(0, 20) + String.fromCharCode(payload.charCodeAt(20) ^ 1) + payload.slice(21);
    const manifestEpoch = mode === 'stale_backup' ? (live != null ? live - 2 : null) : live;
    const recomputed = mode === 'bit_flip' ? sha256(flipped) : digest;
    const checks = [
      { n: 1, name: 'Manifest signature (key from anchor)', code: 'bad_signature', ok: true, note: 'ML-DSA-65 verify (not re-run in browser)' },
      { n: 2, name: 'schema_version supported', code: 'unsupported_schema', ok: true },
      { n: 3, name: 'SHA-256(payload) = payload_sha256', code: 'digest_mismatch', ok: recomputed === digest, note: `manifest ${digest.slice(0, 16)}… vs payload ${recomputed.slice(0, 16)}…` },
      { n: 4, name: 'revocation_epoch ≥ live highest epoch', code: 'stale_backup', ok: mode !== 'stale_backup', note: `backup epoch ${manifestEpoch ?? 'E−2'} vs live ${live ?? 'E'}` },
      { n: 5, name: 'Unwrap DEK_b (ML-KEM-768) + AES-GCM open', code: 'decrypt_failed', ok: true },
      { n: 6, name: 'PRAGMA integrity_check + key material', code: 'incomplete_backup', ok: true },

/* ---------- chunk delivery simulator (deterministic, seeded) ---------- */
function chunkInit() {
  const u = AppState.ui; const total = Math.max(1, Math.ceil(u.chunkSize / 16));
  u.chunk = { seed: u.chunkSeed, total, rng: null, round: 0, tries: Array(total).fill(0), got: Array(total).fill(false), lastLost: Array(total).fill(false), retries: 0, dups: 0, log: [`seed ${u.chunkSeed}: ${u.chunkSize} KiB → ${total} × 16 KiB chunks; chunk_total=${total} sealed into every record's AAD`], state: 'sending', truncate: u.chunkTruncate };
  u.chunk.rngState = u.chunkSeed;
}
function chunkRound() {
  const c = AppState.ui.chunk; if (!c || c.state !== 'sending') return;
  const rng = mulberry32(c.rngState + c.round * 7919);
  c.round++;
  const pending = []; for (let i = 0; i < c.total; i++) if (!c.got[i]) pending.push(i);
  const sendable = pending.filter(i => c.tries[i] < 4);
  const arrivals = []; c.lastLost = Array(c.total).fill(false);
  sendable.forEach(i => {
    if (c.tries[i] > 0) c.retries++;
    c.tries[i]++;
    const forceDrop = c.truncate && i === c.total - 1;
    if (forceDrop || rng() < 0.3) { c.lastLost[i] = true; return; }
    arrivals.push(i); if (rng() < 0.25) arrivals.push(i);
  });
  for (let k = arrivals.length - 1; k > 0; k--) { const j = Math.floor(rng() * (k + 1)); [arrivals[k], arrivals[j]] = [arrivals[j], arrivals[k]]; }
  const recv = [];
  arrivals.forEach(i => { if (c.got[i]) { c.dups++; recv.push(`#${i}(dup→dropped)`); } else { c.got[i] = true; recv.push(`#${i}`); } });
  const lost = c.lastLost.map((x, i) => x ? `#${i}` : null).filter(Boolean);
  c.log.push(`round ${c.round}: sent [${sendable.map(i => '#' + i + (c.tries[i] > 1 ? `(retry ${c.tries[i] - 1})` : '')).join(' ')}] · arrived ${recv.join(' ') || '—'}${lost.length ? ` · lost ${lost.join(' ')}` : ''}`);
  if (c.got.every(Boolean)) {
    c.state = 'delivered';
    c.log.push(`transport receipt ${c.total}/${c.total} · reassembly complete (chunk_total ${c.total} authenticated) · delivered to app exactly once`);
  } else if (pending.every(i => c.got[i] || c.tries[i] >= 4)) {
    c.state = 'expired';
    const miss = c.got.map((g, i) => g ? null : i).filter(x => x != null);
    c.log.push(`max 3 retries exhausted for ${miss.map(i => '#' + i).join(' ')} · transport receipt ${c.got.filter(Boolean).length}/${c.total} · authenticated chunk_total=${c.total} ≠ received → incomplete message discarded (not delivered)`);
  }
}
function renderChunkSim() {
  const u = AppState.ui; if (!u.chunk) chunkInit(); const c = u.chunk;
  const got = c.got.filter(Boolean).length;
  return `<div class="row" style="gap:12px">
      <label class="field">seed <input type="number" value="${esc(u.chunkSeed)}" data-input="chunk-seed" style="width:90px"></label>
      <label class="field">message <select data-input="chunk-size">${[40, 64, 256].map(s => `<option value="${s}" ${u.chunkSize === s ? 'selected' : ''}>${s} KiB (${Math.ceil(s / 16)} chunks)</option>`).join('')}</select></label>
      <label class="field"><input type="checkbox" data-input="chunk-trunc" ${u.chunkTruncate ? 'checked' : ''}> force-drop last chunk (truncation)</label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm primary" data-action="chunk-step" ${c.state !== 'sending' ? 'disabled' : ''}>Next round ▶</button>
      <button class="btn sm" data-action="chunk-run" ${c.state !== 'sending' ? 'disabled' : ''}>Run to end ⏭</button>
      <button class="btn sm" data-action="chunk-reset">Reset ↺</button>
    </div>
    <div class="chunks" style="margin-top:12px">${c.got.map((g, i) => `<div class="chunk ${g ? 'got' : c.state === 'expired' ? 'dead' : c.lastLost[i] ? 'lost' : ''}">#${i}<div style="font-size:10px;opacity:.8">${g ? 'received' : c.state === 'expired' ? 'expired' : c.lastLost[i] ? 'lost' : 'pending'} · tries ${c.tries[i]}</div></div>`).join('')}</div>
    <div class="stats" style="margin-top:12px">
      ${stat('Transport receipt', `${got}/${c.total}`, got === c.total ? 'ok' : 'am')}
      ${stat('Retries', c.retries, 'cy', 'max 3 per chunk')}
      ${stat('Duplicates dropped', c.dups, 'cy', 'replay window')}
      ${stat('Reassembly', c.state === 'delivered' ? 'complete' : c.state === 'expired' ? 'failed' : '…', c.state === 'delivered' ? 'ok' : c.state === 'expired' ? 'bad' : '')}
      ${stat('App delivery', c.state === 'delivered' ? 'exactly once' : c.state === 'expired' ? 'none' : '…', c.state === 'delivered' ? 'ok' : c.state === 'expired' ? 'bad' : '')}
    </div>
    <div class="log" style="margin-top:10px">${c.log.map(l => `<div>${esc(l)}</div>`).join('')}</div>`;
}

async function loadFiles(fileList) {
  const files = Array.from(fileList || []);
  for (const file of files) {
    let text;
    try { text = await file.text(); } catch (e) { AppState.rejected.push({ name: file.name, reason: 'could not read file' }); continue; }
    let data = null, parseErr = null;
    if (!/\.txt$/i.test(file.name)) { try { data = JSON.parse(text); } catch (e) { parseErr = e.message; } }
    const key = EvidenceParser.identify(file.name, data, text);
    if (!key) { AppState.rejected.push({ name: file.name, reason: parseErr ? `invalid JSON (${parseErr})` : 'unrecognised evidence file' }); continue; }
    if (key === 'msgDemo') data = EvidenceParser.parseMsgDemo(text);
    else if (parseErr) { AppState.evidence[key] = null; AppState.fileMeta[key] = { loaded: true, source: 'file', filename: file.name, status: 'error', recordCount: 0, warnings: [`invalid JSON: ${parseErr}`] }; continue; }
    const v = EvidenceParser.validate(key, data);
    AppState.evidence[key] = data;
    AppState.fileMeta[key] = { loaded: true, source: 'file', filename: file.name, ...v };
    if (key === 'demo') AppState.activeStoryboardStep = 1;
    if (key === 'detectPractice') AppState.ui.alertSel = null;
  }
  render();
}
function bindDrop() {
  const d = $('#drop'); if (!d) return;
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('over'); loadFiles(e.dataTransfer.files); });
  d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file-input').click(); } });
}
// prevent the browser from navigating away when a file is dropped outside the drop zone
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { if (!e.target.closest || !e.target.closest('#drop')) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); } });
$('#file-input').addEventListener('change', e => { loadFiles(e.target.files); e.target.value = ''; });

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]'); if (!t || t.disabled) return;
  const a = t.dataset.action; const u = AppState.ui;
  switch (a) {
    case 'menu': { const sb = $('#sidebar'); const open = sb.classList.toggle('open'); t.setAttribute('aria-expanded', String(open)); return; }
    case 'goal': Router.go(`#goal/${t.dataset.g}`); return;
    case 'story': AppState.activeStoryboardStep = +t.dataset.n; break;
    case 'story-prev': AppState.activeStoryboardStep--; break;
    case 'story-next': AppState.activeStoryboardStep++; break;
    case 'partition': u.partition = !u.partition; break;
    case 'pick': $('#file-input').click(); return;
    case 'reset-evidence': resetEvidence(); u.alertSel = null; u.chunk = null; break;
    case 'goto-loader': if (AppState.activeSection !== 'overview') { Router.go('#overview'); setTimeout(() => $('#loader') && $('#loader').scrollIntoView({ behavior: 'smooth' }), 30); } else { const l = $('#loader'); if (l) l.scrollIntoView({ behavior: 'smooth' }); } return;
    case 'sim': AppState.auditSimMode = t.dataset.mode; break;
    case 'crash': u.crashPoint = +t.dataset.i; break;
    case 'alert': u.alertSel = u.alertSel === t.dataset.id ? null : t.dataset.id; break;
    case 'cls': u.classFilter = t.dataset.c; u.alertSel = null; break;
    case 'hs': u.hsStep = clamp(u.hsStep + (+t.dataset.d), 0, 7); break;
    case 'chunk-step': chunkRound(); break;
    case 'chunk-run': { let guard = 0; while (u.chunk && u.chunk.state === 'sending' && guard++ < 20) chunkRound(); break; }
    case 'chunk-reset': chunkInit(); break;
    default: return;
  }
  const focusKey = t.dataset.action + '|' + (t.dataset.mode || t.dataset.i || t.dataset.id || t.dataset.c || t.dataset.d || t.dataset.n || '');
  render();
  // restore keyboard focus to the equivalent control after re-render
  const again = $$('[data-action]').find(x => x.dataset.action + '|' + (x.dataset.mode || x.dataset.i || x.dataset.id || x.dataset.c || x.dataset.d || x.dataset.n || '') === focusKey);
  if (again && !again.disabled && document.activeElement === document.body) again.focus({ preventScroll: true });
});
document.addEventListener('keydown', (e) => {
  const tr = e.target.closest && e.target.closest('tr[data-action]');
  if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click(); return; }
  if (AppState.activeSection === 'goal' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && !e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.key === 'ArrowRight') Router.go(`#goal/${AppState.activeGoal % 12 + 1}`);
    if (e.key === 'ArrowLeft') Router.go(`#goal/${(AppState.activeGoal + 10) % 12 + 1}`);
  }
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  if (k === 'story') { AppState.activeStoryboardStep = +e.target.value; render(); const r = $('input[data-input="story"]'); if (r) r.focus({ preventScroll: true }); }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return; const u = AppState.ui;
  if (k === 'chunk-seed') { const v = parseInt(e.target.value, 10); u.chunkSeed = Number.isFinite(v) ? v : 2026; chunkInit(); render(); }
  if (k === 'chunk-size') { u.chunkSize = +e.target.value; chunkInit(); render(); }
  if (k === 'chunk-trunc') { u.chunkTruncate = e.target.checked; chunkInit(); render(); }
});
window.addEventListener('hashchange', () => Router.apply());

resetEvidence();
Router.apply();
</script>
